      <stop offset=".52" stop-color="#071014"/>
      <stop offset="1" stop-color="#030607"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx=".38" cy=".26" r=".58">
      <stop offset="0" stop-color="#24e6d0" stop-opacity=".42"/>
      <stop offset=".48" stop-color="#24e6d0" stop-opacity=".08"/>
      <stop offset="1" stop-color="#24e6d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx=".7" cy=".82" r=".5">
