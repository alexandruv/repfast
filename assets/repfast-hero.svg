<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">RepFast product visual</title>
  <desc id="desc">A dark gym scene with a phone showing a strength logging interface beside a loaded barbell.</desc>
  <defs>
